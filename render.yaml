services:
  - type: web
    name: invoiceguard-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_V1_STR
        value: /api
      - key: SECRET_KEY
        generateValue: true
